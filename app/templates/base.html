<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}zero-trace{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="topnav">
    <span class="brand">zero-trace</span>
    <a href="/">Dashboard</a>
    <a href="/flows?profile_id={{ profile.id if profile else 0 }}" class="{% if request.url.path == '/flows' %}active{% endif %}">Flows</a>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
